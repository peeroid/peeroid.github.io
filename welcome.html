<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Peeroid</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .welcome-container {
      background: white;
      border-radius: 16px;
      padding: 48px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
    }

    .app-name {
      font-size: 32px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 16px;
      color: #6b7280;
      margin-bottom: 32px;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .link {
      display: inline-block;
      padding: 8px 16px;
      color: #6b7280;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s ease;
    }

    .link:hover {
      color: #4f46e5;
      text-decoration: underline;
    }

    .cta-button {
      display: inline-block;
      padding: 14px 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 600;
      font-size: 18px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      margin-bottom: 24px;
    }

    .cta-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
    }

    .footer-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .footer-link {
      color: #9ca3af;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-link:hover {
      color: #6b7280;
    }

    .separator {
      color: #d1d5db;
    }
  </style>
</head>
<body>
  <div class="welcome-container">
    <img src="peeroid.svg" alt="Peeroid Logo" class="logo">
    <h1 class="app-name">Peeroid</h1>
    <p class="tagline">Your decentralized peer-to-peer platform</p>
    <a href="#" class="cta-button">Let's Go</a>

    <div class="footer-links">
      <a href="terms_of_service.html" target="_blank" class="footer-link">Terms of Service</a>
      <span class="separator">|</span>
      <a href="privacy_policy.html" target="_blank" class="footer-link">Privacy Policy</a>
    </div>
  </div>
</body>
</html>
